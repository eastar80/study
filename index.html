<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 대시보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>나의 대시보드</h1>
      <p class="subtitle" id="today-label"></p>
    </header>

    <main class="cards">
      <section class="card" id="weather-card">
        <div class="card-header">
          <h2>오늘의 날씨</h2>
          <button class="refresh-btn" id="weather-refresh" title="새로고침">↻</button>
        </div>
        <div class="card-body" id="weather-body">
          <p class="status">날씨 정보를 불러오는 중...</p>
        </div>
      </section>

      <section class="card" id="stock-card">
        <div class="card-header">
          <h2>코스피 (KOSPI)</h2>
          <button class="refresh-btn" id="stock-refresh" title="새로고침">↻</button>
        </div>
        <div class="card-body" id="stock-body">
          <p class="status">지수 정보를 불러오는 중...</p>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <p>날씨: Open-Meteo · 코스피: Yahoo Finance</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
