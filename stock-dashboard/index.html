<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한국 주식 대시보드</title>
    <meta
      name="description"
      content="기업명이나 종목코드를 입력하면 주가, 최근 뉴스, 최근 공시를 한 화면에서 보여주는 대시보드입니다."
    />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <h1 class="brand">한국 주식 대시보드</h1>
        <span class="brand-sub">주가 · 뉴스 · 공시</span>
      </div>
    </header>

    <main class="wrap">
      <form class="search" id="search-form" autocomplete="off">
        <div class="search-row">
          <div class="search-field">
            <label for="q" class="sr-only">기업명 또는 종목코드</label>
            <input
              id="q"
              type="text"
              placeholder="기업명 또는 종목코드 (예: 삼성전자, 000660)"
            />
            <div class="suggest" id="suggest" role="listbox"></div>
          </div>
          <button type="submit" id="search-btn">조회</button>
        </div>
        <p class="hint">기업명 일부만 입력해도 되고, 6자리 종목코드를 직접 넣어도 됩니다.</p>
      </form>

      <div class="empty-hero" id="empty">
        <h2>기업을 검색해 보세요</h2>
        <p>주가 추이, 최근 뉴스, 공시 바로가기를 한 번에 확인합니다.</p>
        <div class="chips">
          <button type="button" class="chip">삼성전자</button>
          <button type="button" class="chip">SK하이닉스</button>
          <button type="button" class="chip">NAVER</button>
          <button type="button" class="chip">카카오</button>
          <button type="button" class="chip">현대차</button>
        </div>
      </div>

      <div class="results" id="results"></div>

      <p class="footnote">
        데이터 출처: 주가는 Yahoo Finance, 뉴스는 Google News, 공시는 금융감독원 DART입니다.
        무료 공개 프록시를 경유하므로 응답이 지연되거나 일시적으로 실패할 수 있습니다.
        표시되는 정보는 참고용이며 투자 판단의 근거로 사용하지 마세요.
      </p>
    </main>

    <script src="tickers.js"></script>
    <script src="chart.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
